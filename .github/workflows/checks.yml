name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU motion dependencies
        run: python -m pip install -r configs/requirements-motion.txt
      - name: Check shell syntax
        run: |
          bash -n project.sh
          for script in scripts/*.sh; do bash -n "$script" || exit; done
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Test command entry points
        run: python -m unittest discover -s tests -v
