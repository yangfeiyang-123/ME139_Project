<!doctype html><html lang="zh"><meta charset="utf-8"><title>正手高远球 · SMPL / G1</title>
<style>body{margin:24px;background:#111827;color:#e5e7eb;font:16px system-ui}h1{font-size:24px}select,button{padding:9px;margin:6px;background:#243247;color:white;border:1px solid #64748b;border-radius:6px}.views{display:flex;gap:12px}section{flex:1;min-width:0}canvas,video{width:100%;height:65vh;background:#0b1220;object-fit:contain;border-radius:10px}input{width:75%}small{color:#94a3b8}a{color:#67e8f9}</style>
<h1>正手高远球 · 原视频 / SMPL / Unitree G1</h1>
<select id="clips"></select><button id="play">播放 / 暂停</button><button id="reset">重置视角</button><span id="status"></span>
<div class="views"><section><p>原视频（按 frame_ids 对齐）</p><video id="video" muted playsinline preload="auto"></video></section><section><p>SMPL 表面点云 · 拖动旋转</p><canvas id="human"></canvas></section><section><p>G1 运动学骨架 · 拖动旋转</p><canvas id="robot"></canvas></section></div>
<p><input id="seek" type="range" min="0" value="0"><span id="frame"></span></p>
<small>SMPL 使用数据内的世界坐标顶点。G1 为受关节限位约束的初步运动学重定向，未验证平衡、碰撞或实机可执行性。可暂停、逐帧拖动；切换动作会加载对应数据。</small>
<script>
const CLIPS=__CLIPS__,sel=document.querySelector('#clips'),video=document.querySelector('#video'),seek=document.querySelector('#seek');
let data=null,idx=0,playing=false,t0=0,yaw=-0.65,pitch=0.1;
CLIPS.forEach((c,i)=>sel.add(new Option(c.name,i)));
window.setClip=d=>{data=d;idx=0;playing=false;seek.max=d.ids.length-1;video.src=d.video;video.onloadedmetadata=()=>{video.currentTime=d.ids[0]/d.fps};document.querySelector('#status').textContent=`${d.ids.length} 帧 · ${d.fps} FPS`;draw()};
function load(){data=null;video.pause();const s=document.createElement('script');s.src=CLIPS[+sel.value].file;s.onload=()=>s.remove();document.body.append(s)}sel.onchange=load;
function project(p,w,h){const x=p[0]*Math.sin(yaw)+p[1]*Math.cos(yaw),depth=p[0]*Math.cos(yaw)-p[1]*Math.sin(yaw);return [w/2-x*h*.39,h*.88-(p[2]*Math.cos(pitch)+depth*Math.sin(pitch))*h*.39]}
function render(id,points,edges){const c=document.getElementById(id);c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.fillStyle='#0b1220';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#26364c';ctx.lineWidth=1;
for(let i=-4;i<=4;i++){for(const pair of [[[i/2,-2,0],[i/2,2,0]],[[-2,i/2,0],[2,i/2,0]]]){let a=project(pair[0],w,h),b=project(pair[1],w,h);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}}
if(!points){ctx.fillStyle='#94a3b8';ctx.font='18px system-ui';ctx.fillText('尚未加载 G1 轨迹',30,60);return}const pp=points.map(p=>project(p,w,h));
if(edges){ctx.strokeStyle='#fbbf24';ctx.lineWidth=6*devicePixelRatio;edges.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(...pp[a]);ctx.lineTo(...pp[b]);ctx.stroke()})}
ctx.fillStyle=edges?'#fff7d6':'#67e8f9';pp.forEach(p=>{ctx.beginPath();ctx.arc(...p,(edges?3:1.15)*devicePixelRatio,0,Math.PI*2);ctx.fill()})}
function draw(){if(!data)return;render('human',data.points[idx]);render('robot',data.robot?.[idx],data.edges);seek.value=idx;document.querySelector('#frame').textContent=`${idx+1}/${data.ids.length} · 视频帧 ${data.ids[idx]}`}
seek.oninput=()=>{if(!data)return;playing=false;video.pause();idx=+seek.value;video.currentTime=data.ids[idx]/data.fps;draw()};
document.querySelector('#play').onclick=()=>{if(!data)return;playing=!playing;if(playing){t0=performance.now()-(data.ids[idx]-data.ids[0])/data.fps*1000;video.currentTime=data.ids[idx]/data.fps;video.play().catch(()=>{})}else video.pause()};
function tick(t){if(playing&&data){let f=(t-t0)/1000*data.fps+data.ids[0];if(f>data.ids.at(-1)){idx=0;t0=t;video.currentTime=data.ids[0]/data.fps;video.play().catch(()=>{})}else{while(idx<data.ids.length-1&&data.ids[idx+1]<=f)idx++}draw()}requestAnimationFrame(tick)}
for(const id of ['human','robot']){const c=document.getElementById(id);let last=null;c.onpointerdown=e=>{last=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointerup=()=>last=null;c.onpointermove=e=>{if(!last)return;yaw+=(e.clientX-last[0])*.01;pitch=Math.max(-.8,Math.min(.8,pitch+(e.clientY-last[1])*.005));last=[e.clientX,e.clientY];draw()}}
document.querySelector('#reset').onclick=()=>{yaw=-.65;pitch=.1;draw()};window.onresize=draw;load();requestAnimationFrame(tick);
</script></html>
